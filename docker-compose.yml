version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: order_gateway_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-order_gateway}
      MYSQL_USER: ${DB_USERNAME:-order_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-order_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: order_gateway_app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-order_user}
      DB_PASSWORD: ${DB_PASSWORD:-order_password}
      DB_NAME: ${DB_NAME:-order_gateway}
      APP_NAME: "Order Gateway API"
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
