[project]
name = "order-gateway"
version = "1.0.0"
description = "QPMN Order Gateway API - Manages print orders, including validation, submission, and status tracking."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
    # starlette 1.3's TestClient prefers httpx2 at import time; the project's
    # runtime HTTP stack stays on httpx (8 modules import it directly), so this
    # third-party import-line warning is noise — silenced precisely by message
    # until the runtime migrates. All other warnings still surface.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
